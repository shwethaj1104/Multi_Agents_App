[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "loandesk-backend"
version = "0.1.0"
description = "Shared API and loan review workflows for LoanDesk"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "langchain>=1.5.0",
  "langgraph>=1.2.22",
  "langchain-openai>=1.8.0",
  "langgraph-checkpoint-mongodb>=0.5.1",
  "langgraph-checkpoint-sqlite>=3.1.3",
  "pymongo>=4.20.0",
  "pypdf>=7.1.0",
  "python-multipart>=0.0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/loandesk"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
